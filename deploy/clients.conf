# /etc/apache2/sites-available/clients.conf
# Remplacer DOMAINE.TLD par votre domaine.
# Modules : sudo a2enmod proxy proxy_http headers rewrite
# Certificat : sudo certbot --apache -d clients.DOMAINE.TLD
<VirtualHost *:80>
    ServerName clients.DOMAINE.TLD

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3344/
    ProxyPassReverse / http://127.0.0.1:3344/

    ErrorLog ${APACHE_LOG_DIR}/clients_error.log
    CustomLog ${APACHE_LOG_DIR}/clients_access.log combined
</VirtualHost>
